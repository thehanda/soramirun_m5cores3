[env:m5stack-cores3]
platform  = espressif32
board     = m5stack-cores3
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    m5stack/M5CoreS3 @ ^1.0.0
    m5stack/M5Unified @ ^0.1.16

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
